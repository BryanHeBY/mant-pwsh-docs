name: validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ManT
        run: cargo install mant --version 0.6.0 --locked
      - name: Validate published documentation
        run: npm run validate
